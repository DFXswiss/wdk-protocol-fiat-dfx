appId: io.tether.wdk.starter.reactnative
---
- launchApp:
    clearState: true
    clearKeychain: true
- tapOn: "Import Existing Wallet"
- tapOn:
    id: "import-seed"
- longPressOn:
    id: "import-seed"
- tapOn: "Paste"
- waitForAnimationToEnd
- pressKey: Enter
- waitForAnimationToEnd
- tapOn:
    id: "import-submit"
- extendedWaitUntil:
    visible:
      id: "password-input"
    timeout: 60000
- tapOn:
    id: "password-input"
- inputText: "starter-wallet"
- tapOn:
    id: "password-confirm"
- inputText: "starter-wallet"
- pressKey: Enter
- waitForAnimationToEnd
- tapOn:
    id: "password-submit"
- tapOn: "(?i)I prefer to backup manually"
- extendedWaitUntil:
    visible:
      id: "send-entry"
    timeout: 60000
- extendedWaitUntil:
    notVisible: "Couldn't load"
    timeout: 60000
- takeScreenshot: wallet
