appId: io.tether.wdk.starter.reactnative
---
# The seed is on the clipboard, no IBAN is typed, and the account holder's saved account is selected.
# This flow never contains the seed and takes no screenshot before the wallet tab is shown.
- launchApp:
    clearState: true
    clearKeychain: true
- tapOn: "Import Existing Wallet"
- tapOn:
    id: "import-seed"
- longPressOn:
    id: "import-seed"
- tapOn: "Paste"
# Enter dismisses the keyboard that was covering import-submit. A tap
# through that keyboard typed into field 1.
- waitForAnimationToEnd
- pressKey: Enter
- waitForAnimationToEnd
- tapOn:
    id: "import-submit"
- extendedWaitUntil:
    visible:
      id: "password-input"
    timeout: 60000
- tapOn:
    id: "password-input"
- inputText: "starter-wallet"
- tapOn:
    id: "password-confirm"
- inputText: "starter-wallet"
- pressKey: Enter
- waitForAnimationToEnd
- tapOn:
    id: "password-submit"
- tapOn: "(?i)I prefer to backup manually"
- extendedWaitUntil:
    visible:
      id: "${SELL_ENTRY}"
    timeout: 60000
- extendedWaitUntil:
    notVisible: "Couldn't load"
    timeout: 60000
# The sale screen is opened by link because the Sell button has no amount. The screen, the module call and the widget are the same as after the button.
- openLink: "wdkstarterreactnative://sell?amount=${SELL_AMOUNT}"
# iOS asks once whether to open the deep link in the app; accept it so the widget can appear.
- runFlow:
    when:
      visible: "(?i)open in .*wdk-starter-react-native.*"
    commands:
      - tapOn: "Open"
# sell() already puts the amount of the chosen asset on the widget URL. The page opens on the
# bank step. The saved account is selected after the open screenshot.
- extendedWaitUntil:
    visible: "Add or select your IBAN"
    timeout: 90000
- waitForAnimationToEnd
# the widget is open inside the wallet and no bank account is shown yet; the payment-information step prints the payout IBAN next to the deposit address, so that step is not captured.
- takeScreenshot: sell-widget-open
- tapOn: "Add or select your IBAN"
- scrollUntilVisible:
    element: "${MAESTRO_IBAN_PATTERN}"
    direction: DOWN
    centerElement: true
    timeout: 180000
- waitForAnimationToEnd
- tapOn: "${MAESTRO_IBAN_PATTERN}"
- extendedWaitUntil:
    visible: "Payment Information"
    timeout: 120000
- assertVisible: ${MAESTRO_IBAN_PATTERN}
- scrollUntilVisible:
    element: "Blockchain"
    direction: DOWN
    centerElement: true
# The full deposit address is not in the hierarchy. The copy icon sits
# to the right of the shortened address and copies the full address.
- waitForAnimationToEnd
- tapOn:
    rightOf: "0x[a-fA-F0-9]{9}\\.\\.\\.[a-fA-F0-9]{10}"
    width: 21
    height: 21
    tolerance: 6
- waitForAnimationToEnd
- tapOn:
    id: "sell-done"
