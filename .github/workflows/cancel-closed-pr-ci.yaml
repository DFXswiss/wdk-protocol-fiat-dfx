# When a PR is closed or merged, cancel its leftover CI so runners free
# immediately. Cancel by PR number in this repo only (not github.head_ref).
# pull_request_target runs this file from the default branch, including for a
# fork, and keeps actions: write. A pull_request run from a fork is read-only
# and would fail the cancel. Check out that default branch only. Never check
# out the pull request head.
# This workflow is not a required check; do not add a job-level `if:` skip
# (skipped required checks count as pass).
# No-op cancel (nothing left) is a successful run.

name: Cancel CI for closed PR

on:
  pull_request_target:
    types: [closed]

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    name: Cancel leftover CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Cancel leftover runs for this PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-cancel-runs.sh --repo "$GITHUB_REPOSITORY" --pr "${{ github.event.pull_request.number }}" --head-sha "${{ github.event.pull_request.head.sha }}" --base-sha "${{ github.event.pull_request.base.sha }}"
