# Manual live Sepolia sell against the DFX sandbox.
# Enable the schedule only when TEST_SEED and TEST_IBAN repo secrets are set,
# the test account has Sepolia ETH and USDT, and an owner is named here.
# Owner: not yet assigned.

name: Live Sepolia E2E

on:
  workflow_dispatch:
    inputs:
      account:
        description: Account to test
        type: choice
        options:
          - eoa
          - smart
          - all
        default: all
      follow:
        description: Minutes to follow each sale (0-240)
        type: string
        default: '0'
  # schedule:
  #   - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: live-e2e-sepolia-wallet
  cancel-in-progress: false

jobs:
  live-e2e:
    name: Live Sepolia E2E
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.follow || '0') + 30 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Run live sell
        working-directory: e2e
        env:
          TEST_SEED: ${{ secrets.TEST_SEED }}
          TEST_IBAN: ${{ secrets.TEST_IBAN }}
          ACCOUNT: ${{ inputs.account || 'all' }}
          FOLLOW: ${{ inputs.follow || '0' }}
        run: |
          if [ -z "$TEST_SEED" ] || [ -z "$TEST_IBAN" ]; then
            echo 'TEST_SEED and TEST_IBAN repository secrets are required.' >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "$TEST_SEED" > "$RUNNER_TEMP/seed"
          printf '%s\n' "$TEST_IBAN" > "$RUNNER_TEMP/iban"
          node real-sell.mjs --seed-file "$RUNNER_TEMP/seed" --iban-file "$RUNNER_TEMP/iban" --account "$ACCOUNT" --follow "$FOLLOW" --out "$RUNNER_TEMP/real-sell.jsonl" --screenshots "$RUNNER_TEMP/shots" --send --confirm
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-e2e-sepolia
          path: |
            ${{ runner.temp }}/real-sell.jsonl
            ${{ runner.temp }}/shots
          retention-days: 14
      - name: Remove secret files
        if: always()
        run: rm -f "$RUNNER_TEMP/seed" "$RUNNER_TEMP/iban"
