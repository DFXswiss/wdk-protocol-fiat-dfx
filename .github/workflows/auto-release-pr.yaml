name: Auto Release PR

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  # write is required because the release PR is opened with the workflow's own
  # GITHUB_TOKEN rather than with a personal access token.
  pull-requests: write

concurrency:
  group: auto-release-pr
  cancel-in-progress: false

jobs:
  create-release-pr:
    name: Create Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch main branch
        run: git fetch origin main

      - name: Check for existing PR
        id: check-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          body=$(curl -sS -f \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls?base=main&head=${GITHUB_REPOSITORY_OWNER}%3Adevelop&state=open")
          PR_COUNT=$(printf '%s' "$body" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          echo "pr_exists=$([[ $PR_COUNT -gt 0 ]] && echo 'true' || echo 'false')" >> "$GITHUB_OUTPUT"
          echo "::notice::Open PRs from develop to main: $PR_COUNT"

      - name: Check for differences
        id: check-diff
        if: steps.check-pr.outputs.pr_exists == 'false'
        run: |
          DIFF_COUNT=$(git rev-list --count origin/main..origin/develop)
          echo "has_changes=$([[ $DIFF_COUNT -gt 0 ]] && echo 'true' || echo 'false')" >> "$GITHUB_OUTPUT"
          echo "commit_count=$DIFF_COUNT" >> "$GITHUB_OUTPUT"
          echo "::notice::Commits ahead of main: $DIFF_COUNT"

      - name: Create Release PR
        if: steps.check-pr.outputs.pr_exists == 'false' && steps.check-diff.outputs.has_changes == 'true'
        env:
          # The release PR is authored by the Actions bot, not by a person.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_COUNT: ${{ steps.check-diff.outputs.commit_count }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request

          token = os.environ["GH_TOKEN"]
          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          count = os.environ["COMMIT_COUNT"]
          body = "\n".join(
              [
                  "## Automatic Release PR",
                  "",
                  "This PR was automatically created after changes were pushed to develop.",
                  "",
                  f"**Commits:** {count} new commit(s)",
                  "",
                  "### Checklist",
                  "- [ ] Review all changes",
                  "- [ ] Verify CI passes",
                  "- [ ] Approve and merge when ready for production",
              ]
          )
          payload = json.dumps(
              {
                  "title": "Release: develop -> main",
                  "head": "develop",
                  "base": "main",
                  "body": body,
              }
          ).encode()
          req = urllib.request.Request(
              f"{api}/repos/{repo}/pulls",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  created = json.load(resp)
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode()
              raise SystemExit(f"create pull failed: {exc.code} {detail}") from exc
          print(f"::notice::Opened release PR {created.get('html_url')}")
          PY
