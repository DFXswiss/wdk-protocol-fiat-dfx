# PRs into main must come from this repository's develop branch.
# GitHub has no native source-branch restriction; this job is the gate.
# pull_request_target runs the workflow from the default branch, which is
# develop. A pull request cannot replace this job. Do not check out the
# pull request. workflow_dispatch is how the release workflow starts this
# check: a pull request opened with the workflow token does not start
# pull_request_target. Do not add a job-level `if:` that skips on the
# wrong head: a skipped required check counts as passing.

name: Main source branch

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
      - labeled
      - unlabeled
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number into main
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  only-develop:
    name: Main only from develop
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject any head other than this repo's develop
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          THIS_REPO: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -z "$PR_NUMBER" ]; then
              echo "::error::A pull request number is required."
              exit 1
            fi
            body=$(curl -sS -f \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API_URL}/repos/${THIS_REPO}/pulls/${PR_NUMBER}")
            eval "$(printf '%s' "$body" | python3 -c 'import json,shlex,sys; pr=json.load(sys.stdin); head=pr.get("head") or {}; base=pr.get("base") or {}; repo=(head.get("repo") or {}).get("full_name") or ""; ref=head.get("ref") or ""; base_ref=base.get("ref") or ""; sha=head.get("sha") or ""; state=pr.get("state") or ""; sha=sha if isinstance(sha, str) else ""; state=state if isinstance(state, str) else ""; print("HEAD_REF="+shlex.quote(ref)); print("HEAD_REPO="+shlex.quote(repo)); print("BASE_REF="+shlex.quote(base_ref)); print("HEAD_SHA="+shlex.quote(sha)); print("PR_STATE="+shlex.quote(state))')"
            if [ "$PR_STATE" != "open" ]; then
              echo "::error::The pull request must be open (got '${PR_STATE}')."
              exit 1
            fi
            if [ -z "$HEAD_SHA" ] || [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::The pull request head is not the dispatched commit."
              exit 1
            fi
            if [ "$GITHUB_REF" != "refs/heads/develop" ]; then
              echo "::error::Dispatch this check from refs/heads/develop (got '${GITHUB_REF}')."
              exit 1
            fi
          fi
          if [ "$BASE_REF" != "main" ]; then
            echo "::error::This check only applies to a pull request into main (got '${BASE_REF}')."
            exit 1
          fi
          if [ -z "$HEAD_REF" ] || [ -z "$HEAD_REPO" ] || [ -z "$THIS_REPO" ]; then
            echo "::error::Missing pull_request head metadata; refusing to pass."
            exit 1
          fi
          if [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "::error::PRs into main must come from ${THIS_REPO}@develop, not a fork (${HEAD_REPO})."
            exit 1
          fi
          if [ "$HEAD_REF" != "develop" ]; then
            echo "::error::PRs into main must come from develop (got '${HEAD_REF}'). Merge into develop first."
            exit 1
          fi
          echo "Head is ${THIS_REPO}@develop."
