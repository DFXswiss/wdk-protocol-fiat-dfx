# A38 report guard — trusted-base audit of the author-measured local CI report.
# Does NOT check out the pull request. Does NOT execute scripts from the PR.
# The composite action is pinned to the tested public agent implementation.
# Merge this installation onto the trusted base/default branches to activate it.
# mode=enforce publishes failing statuses; required-check settings are separate.
#
# This repository is public. The guard runs on a GitHub-hosted runner.
# It still does not check out the pull request.

name: dfx pr guard

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: false
        type: string
      all_open:
        description: Reconcile every open pull request
        required: false
        type: boolean
        default: false
  workflow_run:
    # Completion of these checks can change readiness. Never name this guard.
    workflows:
      - Module PR CI
      - PR Review Bot
      - CodeQL
    types: [completed]

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write
  actions: write
  checks: read

concurrency:
  group: a38-guard-${{ github.repository }}-${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.all_open)) && 'sweep' || 'event' }}
  cancel-in-progress: false

jobs:
  guard:
    name: dfx pr guard
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.all_open)) && 45 || 10 }}
    steps:
      - name: Require a pull request number or an explicit sweep
        if: github.event_name == 'workflow_dispatch'
        env:
          PR: ${{ inputs.pr }}
          ALL_OPEN: ${{ inputs.all_open }}
        run: |
          set -euo pipefail
          if [ -n "$PR" ] && [ "$ALL_OPEN" = "true" ]; then
            echo "Give a pull request number or all_open, not both." >&2
            exit 1
          fi
          if [ -z "$PR" ] && [ "$ALL_OPEN" != "true" ]; then
            echo "Give a pull request number or set all_open to true." >&2
            exit 1
          fi

      # No actions/checkout of the PR. The composite action loads trusted code
      # from its own action_path (DFXswiss/agent) and reads the base manifest
      # / head workflow YAML via the GitHub API as data only.
      - name: dfx pr guard
        uses: DFXswiss/agent/.github/actions/a38-guard@1b153cdf7a1ac3687ba98cad7d323743050fb54b
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          pr: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr || '' }}
          all_open: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.all_open) }}
