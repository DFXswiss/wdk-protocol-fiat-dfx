# A38 report guard — trusted-base audit of the author-measured local CI report.
# Does NOT check out the pull request. Does NOT execute scripts from the PR.
# The composite action is pinned to the tested public agent implementation.
# Merge this installation onto the trusted base/default branches to activate it.
# mode=enforce publishes failing statuses; required-check settings are separate.
#
# This repository is public. The guard runs on a GitHub-hosted runner.
# It still does not check out the pull request.

name: dfx pr guard

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to reconcile
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write
  actions: write
  checks: read

concurrency:
  group: a38-guard-${{ github.repository }}-${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.pr_number == '')) && 'sweep' || 'event' }}
  cancel-in-progress: false

jobs:
  guard:
    name: dfx pr guard
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.pr_number == '')) && 45 || 10 }}
    steps:
      # No actions/checkout of the PR. The composite action loads trusted code
      # from its own action_path (DFXswiss/agent) and reads the base manifest
      # / head workflow YAML via the GitHub API as data only.
      - name: dfx pr guard
        uses: DFXswiss/agent/.github/actions/a38-guard@1b153cdf7a1ac3687ba98cad7d323743050fb54b
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          pr: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
          all_open: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.pr_number == '') }}
